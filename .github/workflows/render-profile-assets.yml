name: Render profile assets

on:
  push:
    branches: [main]
    paths:
      - "scripts/render-profile-assets.mjs"
      - ".github/workflows/render-profile-assets.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Render assets
        run: node scripts/render-profile-assets.mjs
      - name: Commit rendered assets
        run: |
          if git diff --quiet -- assets/ && [ -z "$(git status --porcelain assets/)" ]; then
            echo "No asset changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/
          git commit -m "chore: render GitHub profile assets"
          git push
